# LLM 模型配置
# 支持多模型切换，通过环境变量 LLM_PROVIDER 选择

models:
  glm:
    model: glm-4.5-air
    provider: openai
    temperature: 0.7
    max_tokens: 1000
    timeout: 30
    max_retries: 2

  deepseek:
    model: deepseek-chat
    provider: openai
    temperature: 0.7
    max_tokens: 1000
    timeout: 30
    max_retries: 2
